name: build-and-release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_smoke_test:
        description: 'Run the full devcontainer up smoke test (slow, ~15-20 min)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Validate template manifests
        run: |
          for tmpl in src/*/devcontainer-template.json; do
            echo "=== $tmpl ==="
            python3 -c "import json; json.load(open('$tmpl'))"
          done

      - name: Generate template docs (verifies manifests)
        run: devcontainer templates generate-docs -p src/

      - name: Simulate template apply and parse devcontainer config
        run: |
          set -euo pipefail
          for tmpl_dir in src/*/; do
            tmpl_name="$(basename "$tmpl_dir")"
            scratch="/tmp/applied-${tmpl_name}"
            rm -rf "$scratch"
            cp -r "$tmpl_dir" "$scratch"

            python3 <<PY
          import json, re, pathlib
          src = pathlib.Path('${tmpl_dir}')
          dst = pathlib.Path('${scratch}')
          manifest = json.loads((src / 'devcontainer-template.json').read_text())
          defaults = {k: v['default'] for k, v in manifest.get('options', {}).items()}
          for f in dst.rglob('*'):
              if not f.is_file(): continue
              try: text = f.read_text()
              except UnicodeDecodeError: continue
              new = text
              for k, v in defaults.items():
                  new = re.sub(r'\${templateOption:' + re.escape(k) + r'}', v, new)
              leftover = re.findall(r'\${templateOption:[^}]+}', new)
              if leftover:
                  raise SystemExit(f'{f}: unresolved options {leftover}')
              if new != text:
                  f.write_text(new)
          (dst / 'devcontainer-template.json').unlink(missing_ok=True)
          (dst / 'NOTES.md').unlink(missing_ok=True)
          print(f'  applied: {tmpl_name}')
          PY

            echo "  read-configuration: $tmpl_name"
            cd "$scratch" && devcontainer read-configuration --workspace-folder . --include-merged-configuration > /dev/null
            cd -
          done

  smoke-test:
    if: github.event_name == 'workflow_dispatch' && inputs.full_smoke_test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Pre-substitute template options in src/magento
        run: |
          set -euo pipefail
          cd src/magento
          for f in .devcontainer/.env .devcontainer/Dockerfile-magento .devcontainer/commerce.sh; do
            sed -i \
              -e 's|${templateOption:phpVersion}|8.3|g' \
              -e 's|${templateOption:composerVersion}|latest-stable|g' \
              -e 's|${templateOption:commerceEdition}|magento/project-community-edition|g' \
              "$f"
          done

      - name: Smoke-test magento template (devcontainer up)
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
          TEST_MODE: "true"
        run: |
          devcontainer up \
            --workspace-folder src/magento \
            --remove-existing-container

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Publish templates
        run: |
          devcontainer templates publish \
            -r ghcr.io \
            -n ${{ github.repository_owner }}/devcontainer-templates \
            ./src
